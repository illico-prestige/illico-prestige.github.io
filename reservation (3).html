<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Réservez en ligne vos livraisons, services et événements à Molsheim et alentours : Illic'o Prestige et Instant Prestige Events.">
<meta name="theme-color" content="#222222">
<title>Réserver · Illic'o Prestige</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#222;--card:#2c2c2c;--line:#3d3d3d;--or:#f26a1b;--txt:#f3f3f3;--mut:#a9a9a9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:400 16px/1.6 Montserrat,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:400;color:var(--or);margin:0}
header{padding:28px 20px 8px;text-align:center}
.logo{display:block;margin:0 auto 10px;width:96px;height:96px;border-radius:50%}
header h1{font-size:2rem}
header p{margin:4px 0 0;font-style:italic;color:var(--mut)}
main{max-width:860px;margin:0 auto;padding:16px 20px 60px}
.steps{display:flex;gap:8px;justify-content:center;margin:18px 0 28px}
.steps span{height:3px;width:56px;background:var(--line);border-radius:2px}
.steps span.on{background:var(--or)}
h2{font-size:1.6rem;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;color:var(--txt);cursor:pointer;font:inherit;transition:border-color .2s,transform .2s}
.svc:hover,.svc:focus-visible{border-color:var(--or);outline:none}
.svc h3{font-size:1.15rem;margin-bottom:6px}
.svc p{margin:0 0 10px;font-size:.85rem;color:var(--mut)}
.svc b{font-weight:600}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.tab{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 20px;color:var(--txt);font:inherit;cursor:pointer;text-align:left}
.tab b{display:block;font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:1.1rem}
.tab small{color:var(--mut)}
.tab.on{border-color:var(--or)}.tab.on b{color:var(--or)}
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:420px;margin:0 auto}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:1.15rem;text-transform:capitalize}
.calh button{background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.calh button:disabled{opacity:.3;cursor:not-allowed}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg i{font-style:normal;color:var(--mut);font-size:.75rem;padding:4px 0}
.cd{aspect-ratio:1;border:0;border-radius:8px;background:none;color:var(--txt);font:inherit;cursor:pointer}
.cd:hover:not(:disabled){background:var(--line)}
.cd:disabled{color:#555;cursor:not-allowed}
.cd.sel,.slot.sel{background:var(--or);border-color:var(--or);color:#fff}
.top{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tel{display:inline-block;background:none;font:inherit;cursor:pointer;border:1px solid var(--or);color:var(--or);border-radius:999px;padding:7px 18px;font-size:.85rem;text-decoration:none}
.tel:hover,.tel:focus-visible{background:var(--or);color:#fff;outline:none}
:root[data-theme="light"]{--bg:#f7f4ef;--card:#fff;--line:#e3dbd0;--or:#d9560c;--txt:#222;--mut:#6a6a6a}
:root[data-theme="light"] .demo{background:#ffe8d6;color:#8a3b0a}
:root[data-theme="light"] .err{color:#c0392b}
:root[data-theme="light"] .cd:disabled{color:#bbb}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.8rem;color:var(--mut);margin-top:18px;line-height:1.45}
.chk input{width:auto;margin-top:3px;accent-color:var(--or)}
.note{font-size:.8rem;color:var(--mut);margin:8px 0 0}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.dur{color:var(--mut);font-weight:400;font-size:.8rem}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:14px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--txt);cursor:pointer;font:inherit}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.cc.on{border-color:var(--or)}
.cbtn{width:100%;background:none;border:0;color:var(--txt);font:inherit;font-size:.85rem;cursor:pointer;text-align:left;padding:4px 0}
.cc.on .cbtn{color:var(--or);font-weight:600}
.cq{margin-top:6px;font-size:.8rem;color:var(--mut)}
.cq select,.cq input{margin-top:4px;padding:8px}
.wk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.wkh{margin-bottom:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1 1 auto;border:1px solid var(--c);background:none;color:var(--txt);border-radius:999px;padding:7px 12px;font:inherit;font-size:.8rem;cursor:pointer}
.chip.on{background:var(--c);color:#fff;font-weight:600}
select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--txt);font:inherit}
label{display:block;font-size:.85rem;color:var(--mut);margin:14px 0 4px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--txt);font:inherit}
input:focus,textarea:focus{border-color:var(--or);outline:none}
.recap{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--or);border-radius:10px;padding:12px 16px;margin-bottom:8px}
.btn{background:var(--or);color:#fff;border:0;border-radius:999px;padding:13px 28px;font:600 1rem Montserrat,sans-serif;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
.row{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.err{color:#ff8a65;text-align:center;margin-top:12px;min-height:1.2em}
.demo{background:#3a2a1c;color:#ffc9a3;text-align:center;font-size:.8rem;padding:6px}
.ok{text-align:center;padding:30px 0}
.ok .tick{font-size:3rem;color:var(--or)}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:0 20px 30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Mode démo : les réservations restent sur cet appareil.</div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st = {step:1, co:'illico', wk:false, svc:null, month:null, date:null, time:null, taken:new Set(), shifts:{}, adminCode:null, weeks:8};
const useSB = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
if (!useSB) $('#demo').hidden = false;
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const longDate = s => new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

function calHTML(){
  const m=st.month, y=m.getFullYear(), mo=m.getMonth();
  const n=new Date(), today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const last=new Date(today.getFullYear(),today.getMonth(),today.getDate()+CONFIG.DAYS_AHEAD);
  const lim=new Date(n.getTime()+CONFIG.MIN_NOTICE_HOURS*3600000);
  const offset=(new Date(y,mo,1).getDay()+6)%7, nb=new Date(y,mo+1,0).getDate();
  let cells=''; for(let i=0;i<offset;i++) cells+='<span></span>';
  for(let d=1;d<=nb;d++){
    const dt=new Date(y,mo,d), k=iso(dt);
    const off = st.wk
      ? (dt.getDay()!==6||dt<today||dt>last||new Date(`${k}T${CONFIG.HOURS[0]}:00`)<lim||!weekendFree(k))
      : (dt<today||dt>last||CONFIG.CLOSED_DAYS.includes(dt.getDay()));
    cells+=`<button class="cd ${k===st.date?'sel':''}" data-d="${k}" ${off?'disabled':''}>${d}</button>`;
  }
  const prevOff=new Date(y,mo,0)<today, nextOff=new Date(y,mo+1,1)>last;
  return `<div class="calh"><button id="pm" ${prevOff?'disabled':''} aria-label="Mois précédent">‹</button><b>${m.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b><button id="nm" ${nextOff?'disabled':''} aria-label="Mois suivant">›</button></div><div class="cg">${['L','M','M','J','V','S','D'].map(x=>`<i>${x}</i>`).join('')}${cells}</div>`;
}
const durOf = s => s.dur==='day' ? CONFIG.HOURS.length : s.dur;
const durLabel = s => s.dur==='day' ? 'journée entière' : s.dur+' h';
function blockFor(start){
  const i=CONFIG.HOURS.indexOf(start), n=durOf(st.svc);
  return (i<0||i+n>CONFIG.HOURS.length) ? null : CONFIG.HOURS.slice(i,i+n);
}
const weekendDates = sat => { const d=new Date(sat+'T12:00:00'); d.setDate(d.getDate()+1); return [sat, iso(d)]; };
const mondayOf = s => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
const shiftOf = date => SHIFTS[st.shifts[mondayOf(date)]] || SHIFTS.free;
const isBlocked = (date,h) => { const b=shiftOf(date).block; return b===null || b.includes(h); };
const weekendFree = sat => shiftOf(sat).block!==null && weekendDates(sat).every(dt => CONFIG.HOURS.every(h => !st.taken.has(dt+'|'+h)));
const payLink = s => { const l = CONFIG.STRIPE_LINKS[s.id] || CONFIG.STRIPE_DEFAULT; return /^https:\/\//.test(l||'') ? l : ''; };
const payBtn = () => payLink(st.svc) ? `<p style="text-align:center;margin-top:18px"><a class="btn" style="display:inline-block;text-decoration:none" href="${esc(payLink(st.svc))}" target="_blank" rel="noopener">Payer en ligne</a></p>` : '';
const addHour = h => pad(+h.slice(0,2)+1)+':00';
function whenLabel(){
  if(st.wk) return 'Week-end complet, jusqu\'au '+longDate(weekendDates(st.date)[1]);
  const bl=blockFor(st.time);
  return st.svc.dur==='day' ? 'Journée entière (dès '+st.time+')' : st.time+' à '+addHour(bl[bl.length-1]);
}
const priceNote = s => st.wk ? 'Tarif week-end sur devis : le prix vous sera confirmé après votre demande, avant toute prestation.' : s.price.startsWith('sur devis')
  ? 'Tarif sur devis : le prix vous sera confirmé après votre demande, avant toute prestation.'
  : 'Tarif à partir de '+s.price.replace('dès ','')+' : le prix final est confirmé selon votre demande.';

if (CONFIG.LEGAL_URL){ const a=document.getElementById('legal'); a.href=CONFIG.LEGAL_URL; a.hidden=false; }

const mem={};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const applyTheme = t => {
  document.documentElement.dataset.theme = t;
  $('#theme').textContent = t==='light' ? 'Mode sombre' : 'Mode clair';
  document.querySelector('meta[name=theme-color]').content = t==='light' ? '#f7f4ef' : '#222222';
};
applyTheme(store.get('ip_theme')==='light' ? 'light' : 'dark');
$('#theme').onclick = () => { const t = document.documentElement.dataset.theme==='light' ? 'dark' : 'light'; store.set('ip_theme',t); applyTheme(t); };

const sbHeaders = {apikey:CONFIG.SUPABASE_KEY, 'Content-Type':'application/json'};
if (CONFIG.SUPABASE_KEY.startsWith('eyJ')) sbHeaders.Authorization = 'Bearer '+CONFIG.SUPABASE_KEY;

async function loadTaken(){
  st.taken = new Set(); st.shifts = {};
  try{
    if(useSB){
      const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/taken_slots?select=date,time`,{headers:sbHeaders});
      (await r.json()).forEach(x => st.taken.add(x.date+'|'+x.time.slice(0,5)));
      const r2 = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/shifts?select=week_start,shift`,{headers:sbHeaders});
      (await r2.json()).forEach(x => st.shifts[x.week_start]=x.shift);
    }else{
      JSON.parse(store.get('ip_bookings')||'[]').forEach(x => st.taken.add(x.date+'|'+x.time));
      st.shifts = JSON.parse(store.get('ip_shifts')||'{}');
    }
  }catch(e){ $('#err').textContent = "Impossible de charger les disponibilités. Rechargez la page."; }
}
async function saveBooking(rows){
  if(useSB){
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/bookings`,{method:'POST',headers:{...sbHeaders,Prefer:'return=minimal'},body:JSON.stringify(rows)});
    if(r.status===409) return 'taken';
    return r.ok ? 'ok' : 'error';
  }
  const all = JSON.parse(store.get('ip_bookings')||'[]');
  if(rows.some(n => all.some(x => x.date===n.date && x.time===n.time))) return 'taken';
  store.set('ip_bookings',JSON.stringify(all.concat(rows)));
  return 'ok';
}
async function sendMail(b){
  if(!CONFIG.EMAILJS_SERVICE) return;
  const p={service:b.service,date:longDate(b.date),time:b.when,name:b.name,phone:b.phone,email:b.email,to_email:b.email,address:b.address,message:b.message||'(aucun)',price_note:b.note};
  const send = t => fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:CONFIG.EMAILJS_SERVICE,template_id:t,user_id:CONFIG.EMAILJS_KEY,template_params:p})}).catch(()=>{});
  await send(CONFIG.EMAILJS_TEMPLATE);
  if(CONFIG.EMAILJS_TEMPLATE_CLIENT) await send(CONFIG.EMAILJS_TEMPLATE_CLIENT);
}

const COLIS=[
 {id:'repas',name:'Repas / courses',unit:'commande(s)'},
 {id:'vin',name:'Caisse de vin / boissons',unit:'caisse(s)'},
 {id:'colis',name:'Colis / carton',unit:'colis'},
 {id:'meuble',name:'Meuble',unit:'meuble(s)'},
 {id:'electro',name:'Électroménager',unit:'appareil(s)'},
 {id:'fleurs',name:'Fleurs / cadeau',unit:'article(s)'},
 {id:'docs',name:'Documents / courrier',unit:'pli(s)'},
 {id:'autre',name:'Autre',unit:'article(s)'}
];
const colisHTML = () => `<label>Que faut-il transporter ? (touchez un ou plusieurs types)</label><div class="cgrid">${COLIS.map(c=>`<div class="cc" data-c="${c.id}"><button type="button" class="cbtn">${esc(c.name)}</button><div class="cq" hidden>${c.id==='autre'?'<input class="co" placeholder="Précisez (ex : vélo, plante...)">':''}Combien de ${esc(c.unit)} ?<select class="cn">${Array.from({length:50},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div></div>`).join('')}</div>`;
const colisText = () => [...document.querySelectorAll('.cc.on')].map(el=>{const c=COLIS.find(x=>x.id===el.dataset.c),o=el.querySelector('.co');return `${el.querySelector('.cn').value} × ${c.name}${o&&o.value.trim()?' ('+o.value.trim()+')':''}`;});
const fieldHTML = f => {
  const id='x_'+f.id, lab=`<label for="${id}">${esc(f.label)}${f.req?'':' (facultatif)'}</label>`;
  if(f.t==='select') return lab+`<select id="${id}"><option value="">Choisir…</option>${f.o.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  if(f.t==='area') return lab+`<textarea id="${id}" rows="4" placeholder="${esc(f.ph||'')}"></textarea>`;
  return lab+`<input id="${id}" placeholder="${esc(f.ph||'')}">`;
};
const addrHTML = () => st.svc.addr2
  ? `<label for="address">Adresse de départ (où récupérer)</label><input id="address" required autocomplete="street-address"><label for="address2">Adresse d'arrivée (où livrer)</label><input id="address2" required>`
  : `<label for="address">Adresse de la prestation</label><input id="address" required autocomplete="street-address">`;
const extraHTML = () => (st.svc.colis?colisHTML():'') + (st.svc.fields||[]).map(fieldHTML).join('');
function go(n){ st.step=n; $('#err').textContent=''; draw(); window.scrollTo({top:0,behavior:'smooth'}); }
function draw(){
  $('#steps').innerHTML = [1,2,3].map(i=>`<span class="${st.step>=i||st.step===4?'on':''}"></span>`).join('');
  const v = $('#view');
  if(st.step==='admin'){
    if(!st.adminCode){
      v.innerHTML=`<h2>Espace pro</h2><p class="sub">Entrez votre code pour gérer vos disponibilités.</p><form id="af"><label for="ac">Code</label><input id="ac" type="password" autocomplete="current-password"><div class="row"><button type="button" class="btn ghost" id="back">Retour</button><button class="btn">Entrer</button></div></form>`;
      $('#back').onclick=()=>go(1);
      $('#af').onsubmit=async e=>{e.preventDefault();const c=$('#ac').value;let ok=false;
        try{ if(useSB){const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/check_admin`,{method:'POST',headers:sbHeaders,body:JSON.stringify({p_code:c})});ok=(await r.json())===true;} else ok=c===CONFIG.ADMIN_DEMO_CODE; }catch(x){}
        if(!ok){$('#err').textContent='Code incorrect.';return;}
        st.adminCode=c; await loadTaken(); go('admin');};
      return;
    }
    const mon=new Date(); mon.setHours(12,0,0,0); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
    const COL={free:'#4caf50',matin:'#f2b01b',aprem:'#f26a1b',nuit:'#7e57c2',off:'#e0443e'};
    const SHORT={free:'Libre',matin:'Indispo matin',aprem:'Indispo après-midi',nuit:'Indispo nuit',off:'Absent'};
    const fmt=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    let rows='';
    for(let i=0;i<st.weeks;i++){
      const d=new Date(mon); d.setDate(d.getDate()+7*i); const k=iso(d), e=new Date(d); e.setDate(e.getDate()+6);
      const cur=st.shifts[k]||'free';
      rows+=`<div class="wk"><div class="wkh"><b>${esc(fmt(d))} → ${esc(fmt(e))}</b>${i===0?'<span class="dur"> · cette semaine</span>':''}</div><div class="chips">${Object.keys(SHIFTS).map(id=>`<button type="button" class="chip ${cur===id?'on':''}" style="--c:${COL[id]}" data-w="${k}" data-s="${id}">${SHORT[id]}</button>`).join('')}</div></div>`;
    }
    v.innerHTML=`<h2>Mes disponibilités</h2><p class="sub">Touchez votre horaire pour chaque semaine : les créneaux concernés ne seront plus réservables.</p>${rows}<p class="note">Indispo matin : dispo 15h-19h · Indispo après-midi : dispo 8h-12h · Indispo nuit : dispo 8h-19h · Absent : semaine entière. Une semaine non renseignée reste ouverte aux clients.</p><div class="row"><button class="btn ghost" id="more">Voir 8 semaines de plus</button><button class="btn ghost" id="back">Quitter</button></div>`;
    $('#more').onclick=()=>{st.weeks+=8;draw();};
    $('#back').onclick=()=>{st.adminCode=null;st.weeks=8;go(1);};
    v.querySelectorAll('.chip').forEach(c=>c.onclick=async()=>{
      const w=c.dataset.w, val=c.dataset.s; let ok=true;
      try{
        if(useSB){const r=await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/set_shift`,{method:'POST',headers:sbHeaders,body:JSON.stringify({p_code:st.adminCode,p_week:w,p_shift:val})});ok=r.ok;}
        else{st.shifts[w]=val;store.set('ip_shifts',JSON.stringify(st.shifts));}
      }catch(x){ok=false;}
      if(ok){st.shifts[w]=val;c.parentNode.querySelectorAll('.chip').forEach(o=>o.classList.toggle('on',o===c));}
      $('#err').textContent = ok ? '' : 'Enregistrement impossible, réessayez.';
    });
    return;
  }
  if(st.step===1){
    const c=COMPANIES[st.co];
    v.innerHTML = `<h2>Que souhaitez-vous réserver ?</h2><p class="sub">Choisissez votre entreprise, puis votre prestation.</p>
      <div class="tabs">${Object.entries(COMPANIES).map(([k,x])=>`<button class="tab ${k===st.co?'on':''}" data-co="${k}"><b>${esc(x.name)}</b><small>${esc(x.tag)}</small></button>`).join('')}</div>
      <div class="grid">${c.services.map(s=>`<button class="svc" data-id="${s.id}"><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><b>${esc(s.price)}</b> <span class="dur">· ${durLabel(s)}${s.we?' · week-end possible':''}</span></button>`).join('')}</div>`;
    v.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.co=b.dataset.co;draw();});
    v.querySelectorAll('.svc').forEach(b=>b.onclick=()=>{st.svc=c.services.find(s=>s.id===b.dataset.id);st.date=st.time=st.month=null;st.wk=false;loadTaken().then(()=>go(2));});
  }
  if(st.step===2){
    if(!st.month){const n=new Date();st.month=new Date(n.getFullYear(),n.getMonth(),1);}
    v.innerHTML = `<h2>Choisissez votre créneau</h2><p class="sub">${esc(COMPANIES[st.co].name)} · ${esc(st.svc.name)}</p>
      ${st.svc.we?`<div class="tabs"><button class="tab ${!st.wk?'on':''}" data-wk="0"><b>Créneau</b><small>Un jour précis</small></button><button class="tab ${st.wk?'on':''}" data-wk="1"><b>Week-end</b><small>Samedi et dimanche</small></button></div>`:''}
      <div class="cal">${calHTML()}</div>
      <div class="slots" id="slots"></div>
      <div class="row"><button class="btn ghost" id="back">Retour</button><button class="btn" id="next" ${st.time?'':'disabled'}>Continuer</button></div>`;
    v.querySelectorAll('.cd').forEach(b=>b.onclick=()=>{st.date=b.dataset.d;st.time=st.wk?CONFIG.HOURS[0]:null;draw();});
    v.querySelectorAll('[data-wk]').forEach(b=>b.onclick=()=>{st.wk=b.dataset.wk==='1';st.date=st.time=null;draw();});
    $('#pm').onclick=()=>{st.month=new Date(st.month.getFullYear(),st.month.getMonth()-1,1);draw();};
    $('#nm').onclick=()=>{st.month=new Date(st.month.getFullYear(),st.month.getMonth()+1,1);draw();};
    $('#back').onclick=()=>go(1); $('#next').onclick=()=>go(3);
    drawSlots();
  }
  if(st.step===3){
    v.innerHTML = `<h2>Vos informations</h2>
      <div class="recap"><b>${esc(COMPANIES[st.co].name)} · ${esc(st.svc.name)}</b><br>${esc(longDate(st.date))}, ${esc(whenLabel())}<p class="note">${esc(priceNote(st.svc))}</p></div>
      <form id="f" novalidate>
        <label for="name">Nom et prénom</label><input id="name" required autocomplete="name">
        <label for="phone">Téléphone</label><input id="phone" type="tel" required autocomplete="tel">
        <label for="email">E-mail</label><input id="email" type="email" required autocomplete="email">
        ${extraHTML()}${addrHTML()}
        <label for="message">Détails de votre demande (facultatif)</label><textarea id="message" rows="4"></textarea>
        <div class="hp" aria-hidden="true"><label>Ne pas remplir<input id="website" tabindex="-1" autocomplete="off"></label></div>
        <label class="chk"><input type="checkbox" id="rgpd"><span>J'accepte que mes informations soient utilisées uniquement pour traiter ma réservation et me recontacter.</span></label>
        <div class="row"><button type="button" class="btn ghost" id="back">Retour</button><button type="submit" class="btn" id="send">Confirmer ma réservation</button></div>
      </form>`;
    $('#back').onclick=()=>go(2);
    $('#f').onsubmit=submit;
    v.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{const c=b.parentNode;c.classList.toggle('on');c.querySelector('.cq').hidden=!c.classList.contains('on');});
  }
  if(st.step===4){
    v.innerHTML = `<div class="ok"><div class="tick">✓</div><h2>Réservation enregistrée</h2>
      <p class="sub">${esc(st.svc.name)}<br>${esc(longDate(st.date))}, ${esc(whenLabel())}</p>
      <p>Merci ${esc(st.name)}. Vous serez recontacté très rapidement pour confirmer les détails.</p>
      <p class="note">${esc(priceNote(st.svc))}</p>
      ${payBtn()}<div class="row"><button class="btn" id="again">Nouvelle réservation</button></div></div>`;
    $('#again').onclick=()=>go(1);
  }
}
function drawSlots(){
  const box=$('#slots');
  if(st.wk){ box.innerHTML = st.date ? `<div class="recap" style="grid-column:1/-1"><b>Week-end sélectionné</b><br>${esc(longDate(st.date))} et ${esc(longDate(weekendDates(st.date)[1]))}</div>` : '<p class="sub" style="grid-column:1/-1">Sélectionnez un samedi.</p>'; return; }
  if(!st.date){box.innerHTML='<p class="sub" style="grid-column:1/-1">Sélectionnez d\'abord un jour.</p>';return;}
  const now=new Date(), limit=new Date(now.getTime()+CONFIG.MIN_NOTICE_HOURS*3600000);
  const day = st.svc.dur==='day';
  box.innerHTML = (day ? [CONFIG.HOURS[0]] : CONFIG.HOURS).map(h=>{
    const bl=blockFor(h);
    const off = !bl || new Date(`${st.date}T${h}:00`) < limit || bl.some(x => st.taken.has(st.date+'|'+x) || (day ? shiftOf(st.date).block===null : isBlocked(st.date,x)));
    return `<button class="slot ${h===st.time?'sel':''}" data-h="${h}" ${off?'disabled':''}>${day?'Journée entière':h}</button>`;
  }).join('');
  box.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{st.time=b.dataset.h;draw();});
}
async function submit(e){
  e.preventDefault();
  const g = id => $('#'+id).value.trim();
  const b = {service:COMPANIES[st.co].name+' · '+st.svc.name+(st.wk?' (week-end)':''),date:st.date,time:st.time,name:g('name'),phone:g('phone'),email:g('email'),address:g('address'),message:g('message')};
  if(!b.name||!b.phone||!b.address||!/^\S+@\S+\.\S+$/.test(b.email)){ $('#err').textContent='Renseignez votre nom, téléphone, e-mail et adresse.'; return; }
  if(st.svc.addr2){ const a2=g('address2'); if(!a2){ $('#err').textContent="Renseignez l'adresse d'arrivée."; return; } b.address='Départ : '+b.address+' → Arrivée : '+a2; }
  const det=[];
  if(st.svc.colis){ const cl=colisText(), au=document.querySelector('.cc.on[data-c="autre"] .co');
    if(!cl.length){ $('#err').textContent='Choisissez au moins un type de colis.'; return; }
    if(au&&!au.value.trim()){ $('#err').textContent='Précisez le type de colis « Autre ».'; return; }
    det.push('Colis : '+cl.join(', ')); }
  for(const f of (st.svc.fields||[])){ const val=$('#x_'+f.id).value.trim(); if(f.req&&!val){ $('#err').textContent='Renseignez : '+f.label+'.'; return; } if(val) det.push(f.label+' : '+val); }
  if(det.length) b.message = det.join('\\n')+(b.message?'\\nRemarques : '+b.message:'');
  if(!$('#rgpd').checked){ $('#err').textContent='Cochez la case d\'acceptation pour continuer.'; return; }
  if($('#website').value){ st.name=b.name; go(4); return; }
  $('#send').disabled=true; $('#err').textContent='';
  const rows = st.wk
    ? weekendDates(st.date).flatMap(dt => CONFIG.HOURS.map(h => ({...b,date:dt,time:h})))
    : blockFor(st.time).map(h => ({...b,time:h}));
  let res; try{ res = await saveBooking(rows); }catch(err){ res='error'; }
  if(res==='taken'){ await loadTaken(); st.time=null; go(2); $('#err').textContent='Ce créneau vient d\'être réservé. Choisissez-en un autre.'; return; }
  if(res!=='ok'){ $('#send').disabled=false; $('#err').textContent='Une erreur est survenue. Réessayez ou appelez-nous.'; return; }
  sendMail({...b,when:whenLabel(),note:priceNote(st.svc)}); st.name=b.name; go(4);
}
draw();
</script>
